<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">Motorcycle controls — June 2012 reference numbering</title>
<desc id="desc">Original motorcycle schematic. Number markers identify the nine motorcycle controls listed in the South African Department of Transport Learner Driver Manual, Section 3, June 2012.</desc>
<defs><style>
.bg{fill:#f4f7f9}.card{fill:#fff;stroke:#d5e0e6;stroke-width:3}.ink{fill:none;stroke:#233746;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#627888;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.metal{fill:#dce6eb;stroke:#233746;stroke-width:8;stroke-linejoin:round}.accent{fill:#087f78}.n{fill:#fff;font:700 25px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}.h{fill:#163348;font:700 27px system-ui,sans-serif;letter-spacing:1px}.s{fill:#536978;font:600 15px system-ui,sans-serif;letter-spacing:1px}
</style></defs>
<rect width="1100" height="680" rx="26" class="bg"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">Heavy motor vehicle controls — June 2012 reference numbering</title>
<desc id="desc">Original heavy vehicle cab schematic with manual gearbox. Number markers identify the eleven heavy motor vehicle controls listed in the South African Department of Transport Learner Driver Manual, Section 3, June 2012.</desc>
<defs><style>
.bg{fill:#f4f7f9}.card{fill:#fff;stroke:#d5e0e6;stroke-width:3}.ink{fill:none;stroke:#233746;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#627888;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.metal{fill:#dce6eb;stroke:#233746;stroke-width:8;stroke-linejoin:round}.accent{fill:#087f78}.n{fill:#fff;font:700 24px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}.h{fill:#163348;font:700 27px system-ui,sans-serif;letter-spacing:1px}.s{fill:#536978;font:600 15px system-ui,sans-serif;letter-spacing:1px}
</style></defs>
<rect width="1100" height="680" rx="26" class="bg"/>
<text x="46" y="54" class="h">HEAVY MOTOR VEHICLE CONTROLS</text><text x="46" y="82" class="s">MANUAL GEARBOX · NUMBERED REFERENCE · JUNE 2012</text>
<rect x="30" y="110" width="1040" height="530" rx="20" class="card"/>
<text x="58" y="150" class="s">RIGHT-HAND-DRIVE TRUCK CAB SCHEMATIC</text>
<!-- truck windscreen -->
<path d="M135 205 Q550 145 965 205 L1030 360 L70 360Z" fill="#edf3f6" stroke="#233746" stroke-width="11"/>
<path d="M135 205 L70 360 M965 205 L1030 360" class="ink"/>
<!-- truck mirrors -->
<path d="M95 250 L42 220 L28 250 L80 292 M1005 250 L1058 220 L1072 250 L1020 292" class="ink"/>
<rect x="26" y="222" width="54" height="50" rx="10" class="metal"/><rect x="1020" y="222" width="54" height="50" rx="10" class="metal"/>
<path d="M550 198 L550 228" class="thin"/><rect x="505" y="218" width="90" height="22" rx="10" class="metal"/>
<!-- broad truck dash -->
<path d="M70 360 Q550 305 1030 360 L1005 492 Q550 530 95 492Z" fill="#c4d3db" stroke="#233746" stroke-width="11"/>
<rect x="185" y="375" width="300" height="90" rx="12" fill="#eaf0f3" stroke="#627888" stroke-width="7"/>
<circle cx="270" cy="420" r="29" class="metal"/><circle cx="385" cy="420" r="29" class="metal"/>
<rect x="520" y="375" width="110" height="85" rx="12" fill="#eaf0f3" stroke="#627888" stroke-width="7"/>
<!-- steering wheel -->
<circle cx="810" cy="430" r="110" fill="none" stroke="#233746" stroke-width="25"/><circle cx="810" cy="430" r="38" class="metal"/>
<path d="M810 392 L810 320 M772 445 L700 482 M848 445 L920 482" class="ink"/>
<path d="M745 390 L700 360 L682 363 M875 390 L920 360 L940 363" class="ink"/>
<!-- gear lever and parking brake -->
<path d="M555 470 L555 555" class="ink"/><circle cx="555" cy="462" r="20" class="metal"/>
<path d="M675 490 L700 550 L730 550" class="ink"/><rect x="720" y="540" width="96" height="18" rx="8" class="metal"/>
<!-- pedals -->
<path d="M650 570 L650 625 M775 570 L775 625 M900 570 L900 625" class="ink"/>
<rect x="622" y="610" width="56" height="22" rx="7" class="metal"/><rect x="747" y="610" width="56" height="22" rx="7" class="metal"/><rect x="872" y="610" width="56" height="22" rx="7" class="metal"/>
<!-- numbered controls -->
<g><circle cx="550" cy="255" r="23" class="accent"/><text x="550" y="255" class="n">1</text></g>
<g><circle cx="690" cy="355" r="23" class="accent"/><text x="690" y="355" class="n">2</text></g>
<g><circle cx="1050" cy="305" r="23" class="accent"/><text x="1050" y="305" class="n">3</text></g>
<g><circle cx="900" cy="430" r="23" class="accent"/><text x="900" y="430" class="n">4</text></g>
<g><circle cx="925" cy="362" r="23" class="accent"/><text x="925" y="362" class="n">5</text></g>
<g><circle cx="555" cy="520" r="23" class="accent"/><text x="555" y="520" class="n">6</text></g>
<g><circle cx="700" cy="530" r="23" class="accent"/><text x="700" y="530" class="n">7</text></g>
<g><circle cx="650" cy="585" r="23" class="accent"/><text x="650" y="585" class="n">8</text></g>
<g><circle cx="775" cy="585" r="23" class="accent"/><text x="775" y="585" class="n">9</text></g>
<g><circle cx="900" cy="585" r="23" class="accent"/><text x="900" y="585" class="n">10</text></g>
<g><circle cx="810" cy="430" r="22" class="accent"/><text x="810" y="430" class="n">11</text></g>
<text x="58" y="615" class="s">NUMBER MARKERS ONLY · REFER TO THE MANUAL FOR CONTROL DESCRIPTIONS</text>
</svg>
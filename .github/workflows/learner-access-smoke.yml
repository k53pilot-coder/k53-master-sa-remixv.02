name: Built Worker browser smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    # Run against the actual production build locally so Cloudflare bot protection
    # remains enabled and GitHub-hosted runners do not trigger the challenge page.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Build the production Worker
        run: bun run build
      - name: Install Playwright test runner
        run: bunx --package @playwright/test@1.58.2 playwright --version
      - name: Install Chromium
        run: bunx --package @playwright/test@1.58.2 playwright install chromium
      - name: Start the built Cloudflare Worker
        run: |
          bunx wrangler dev --config .output/server/wrangler.json --ip 127.0.0.1 --port 4173 --local > /tmp/k53-worker.log 2>&1 &
          echo $! > /tmp/k53-worker.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/k53-worker.log
          exit 1
        env:
          SUPABASE_URL: https://qfolceulguweezxjvvjt.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_vY4q2CdQ6VyBX52KSMZ93Q_2H-K6dkq
      - name: Test the built application in Chromium
        run: bunx --package @playwright/test@1.58.2 playwright test e2e/production-smoke.spec.mjs --reporter=line
        env:
          K53_BASE_URL: http://127.0.0.1:4173
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
